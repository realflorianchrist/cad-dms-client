query Directory($directoryId: ID!) {
  directory(directoryId: $directoryId) {
    directoryId
    name
    archived
    directories {
      directoryId
      name
      archived
    }
    documents {
      documentId
      archived
      currentVersion {
        documentVersionId
        number
        name
        extension
      }
      versions {
        documentVersionId
        number
        name
        extension
      }
      metadataValues {
        definition {
          metadataDefinitionId
          key
          label
          type
        }
        value
      }
    }
  }
}
